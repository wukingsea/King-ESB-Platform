# Test profile: in-memory H2, no Redis, deterministic credentials. No demo seeding.
spring:
  datasource:
    url: jdbc:h2:mem:esbtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

esb:
  security:
    jwt-secret: test-only-insecure-jwt-secret-0123456789abcdef
    admin-username: admin
    admin-password: admin1234

logging:
  level:
    com.king.esb: INFO
