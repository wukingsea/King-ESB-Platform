# Prod profile: PostgreSQL + Redis. All secrets and endpoints come from the environment.
spring:
  datasource:
    url: ${ESB_DB_URL:jdbc:postgresql://localhost:5432/esb}
    driver-class-name: org.postgresql.Driver
    username: ${ESB_DB_USER:esb}
    password: ${ESB_DB_PASSWORD:esb}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${ESB_REDIS_HOST:localhost}
      port: ${ESB_REDIS_PORT:6379}
      timeout: 2s

esb:
  security:
    jwt-secret: ${ESB_JWT_SECRET}
    admin-username: ${ESB_ADMIN_USERNAME:admin}
    admin-password: ${ESB_ADMIN_PASSWORD}

management:
  endpoint:
    health:
      show-details: never
